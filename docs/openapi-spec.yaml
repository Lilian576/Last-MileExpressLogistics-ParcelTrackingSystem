openapi: 3.1.0
info:
  title: LeMail Parcel Tracking API
  version: 2026-11-25-m3-api-sync
  description: >-
    Contract synchronized with develop a230451, including hub selection, server-derived guards, persisted GPS
    and ParcelNotifierService. Acceptance results and release SHA/tag are pending M4 and the release owner.
servers:
  - url: http://localhost:3000
    description: Local backend, override for deployment.
security: []
tags:
  - name: Auth
    description: Registration and JWT login
  - name: Parcels
    description: Pricing and internal parcel operations
  - name: Public tracking
    description: Tracking by public parcel code
paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: registerCustomer
      description: Always creates customer. A role in input is stripped by ValidationPipe and ignored by AuthService.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer and JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Register a customer
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: JWT and user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Sign in
  /api/parcels/calculate-fee:
    post:
      tags:
        - Parcels
      operationId: calculateFee
      description: >-
        Public validated quote. Weight is between 0 and 1000 kg, latitude between -90 and 90, longitude
        between -180 and 180. Fee is 15000 + 5000/kg + 1000/km Haversine, rounded to VND.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRequest'
      responses:
        '201':
          description: Calculated quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  fee:
                    type: integer
                  currency:
                    const: VND
                  details:
                    type: object
                    properties:
                      weightKg:
                        type: number
                    required:
                      - weightKg
                required:
                  - fee
                  - currency
                  - details
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Calculate a VND shipping quote
  /api/parcels:
    post:
      tags:
        - Parcels
      operationId: createParcel
      security:
        - bearerAuth: []
      description: >-
        Customer role only. Sender ID is taken from JWT. Persists quote, coordinates, dimensions and CREATED
        history, then notifies after successful write. Returns feeVnd plus the compatibility fee field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParcelRequest'
      responses:
        '201':
          description: Created parcel and fee
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Parcel'
                  - type: object
                    properties:
                      fee:
                        type: integer
                    required:
                      - fee
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Create a parcel
    get:
      tags:
        - Parcels
      operationId: listParcels
      description: JWT and RolesGuard restrict the internal parcel list to admin and warehouse_staff.
      responses:
        '200':
          description: Internal parcel list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
      summary: List internal parcels
      security:
        - bearerAuth: []
  /api/parcels/mine:
    get:
      tags:
        - Parcels
      operationId: listMyParcels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Parcels filtered by JWT sender ID
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Parcel'
                    - type: object
                      properties:
                        statusHistory:
                          type: array
                          items:
                            $ref: '#/components/schemas/ParcelStatusHistory'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
      summary: List parcels sent by the caller
  /api/parcels/assigned/mine:
    get:
      tags:
        - Parcels
      operationId: listAssignedParcels
      security:
        - bearerAuth: []
      description: RolesGuard requires shipper. Active assignments only, terminal parcels excluded.
      responses:
        '200':
          description: Assigned parcels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
      summary: List parcels assigned to the shipper
  /api/parcels/{id}:
    get:
      tags:
        - Parcels
      operationId: getParcel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Internal parcel ID
      description: >-
        Authenticated owner, actively assigned shipper, admin or warehouse_staff may read. Missing or
        unauthorized parcel returns 404 to avoid disclosing its existence.
      responses:
        '200':
          description: Parcel or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Read an internal parcel
      security:
        - bearerAuth: []
  /api/parcels/{id}/status:
    patch:
      tags:
        - Parcels
      operationId: updateParcelStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Internal parcel ID
      description: >-
        Actor is derived from JWT; admin maps to dispatcher. Owner/active courier assignment, hub type, final
        hub and failed-attempt count are read from the database. For arrive_at_hub, warehouse_staff supplies
        hubId of an existing hub. For confirm_delivery, the assigned shipper supplies a non-blank
        deliveryProofRef (maximum 200 characters); the current service trims and stores this reference as
        deliveryProof, without verifying image content, a signature or OTP. Other events do not require those
        fields. assign_courier must use its dedicated endpoint. All writes commit before notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
            examples:
              arriveAtHub:
                summary: Warehouse receives at a hub
                value:
                  event: arrive_at_hub
                  hubId: demo-hub-q7
              dispatchLastMile:
                summary: Admin dispatches from the destination hub
                value:
                  event: dispatch_last_mile
              confirmDelivery:
                summary: Assigned courier supplies an evidence reference
                value:
                  event: confirm_delivery
                  deliveryProofRef: demo-evidence-reference
      responses:
        '200':
          description: Updated parcel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Apply a lifecycle event
  /api/parcels/{id}/assign-courier:
    patch:
      tags:
        - Parcels
      operationId: assignCourier
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Internal parcel ID
      description: >-
        Admin only. destinationHubId chooses an existing Location of type hub and is stored as
        destinationLocationId. If omitted, the existing destinationLocationId is reused; missing or invalid
        hub returns 400. Uses both stored sender coordinates when present. pickupLat and pickupLng are
        fallback inputs only for legacy parcels missing either stored sender coordinate; both fallback values
        are then required. No free courier or concurrent write returns 409. Transaction commits before
        notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCourierRequest'
            examples:
              storedCoordinates:
                summary: New parcel with stored sender coordinates
                value:
                  destinationHubId: demo-hub-q7
              legacyCoordinates:
                summary: Legacy parcel without stored pickup coordinates
                value:
                  destinationHubId: demo-hub-q7
                  pickupLat: 10.7292
                  pickupLng: 106.6935
      responses:
        '200':
          description: Parcel and assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcel:
                    $ref: '#/components/schemas/Parcel'
                  assignmentResult:
                    type: object
                    properties:
                      found:
                        const: true
                      courier:
                        type: object
                        properties:
                          id:
                            type: string
                          fullName:
                            type: string
                        required:
                          - id
                          - fullName
                      distanceKm:
                        type: number
                      assignment:
                        $ref: '#/components/schemas/DeliveryAssignment'
                    required:
                      - found
                      - courier
                      - distanceKm
                      - assignment
                required:
                  - parcel
                  - assignmentResult
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Assign the nearest pickup courier
  /api/public/track/{code}:
    get:
      tags:
        - Public tracking
      operationId: trackParcel
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      description: >-
        Public snapshot with raw ParcelStatus, receiverName and timeline. Excludes phone/address, actors and
        delivery proof. location is the last persisted driver position or null. REST and socket use the same
        location format.
      responses:
        '200':
          description: Public timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTracking'
              examples:
                noLocation:
                  summary: No driver position yet
                  value:
                    trackingCode: PCL123
                    currentStatus: CREATED
                    receiverName: Demo receiver
                    history:
                      - status: CREATED
                        timestamp: '2026-11-25T03:00:00.000Z'
                    location: null
                withLocation:
                  summary: Last persisted driver position
                  value:
                    trackingCode: PCL123
                    currentStatus: OUT_FOR_DELIVERY
                    receiverName: Demo receiver
                    history:
                      - status: OUT_FOR_DELIVERY
                        timestamp: '2026-11-25T03:05:00.000Z'
                    location:
                      trackingCode: PCL123
                      latitude: 10.7292
                      longitude: 106.6935
                      timestamp: '2026-11-25T03:06:00.000Z'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
      summary: Read a public tracking timeline
  /api/parcels/hubs:
    get:
      tags:
        - Parcels
      operationId: listHubs
      summary: List hubs for operations
      security:
        - bearerAuth: []
      description: >-
        RolesGuard permits admin and warehouse_staff. Returns only locations of type hub, selecting
        id/name/address and sorting by name ascending.
      responses:
        '200':
          description: Available hubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hub'
              example:
                - id: demo-hub-q7
                  name: Hub Quận 7
                  address: Quận 7, TP.HCM
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
webhooks:
  parcelStatusUpdated:
    post:
      operationId: receiveParcelStatusWebhook
      description: >-
        Implemented by backend/src/parcels/parcel-notifier.service.ts. Optional delivery to PARCEL_WEBHOOK_URL
        after commit. eventId is the committed history ID, occurredAt equals data.event.timestamp. HMAC-SHA256
        covers X-Webhook-Timestamp + "." + exact raw JSON body serialized by JSON.stringify. X-Webhook-Id
        equals eventId, signature is sha256=<lowercase hex>. Fetch timeout is fixed at 2000 ms, redirects are
        rejected. Receiver non-2xx and transport errors are logged without rolling back the parcel or failing
        its successful REST response. Current implementation attempts once and has no automatic retry or
        durable outbox. The receiver should verify signature in constant time, enforce a timestamp window and
        deduplicate eventId.
      parameters:
        - name: X-Webhook-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-Webhook-Timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9]+$
        - name: X-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^sha256=[0-9a-f]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelStatusWebhook'
            example:
              eventId: history-demo-001
              type: parcel.status.updated
              occurredAt: '2026-11-25T03:00:00.000Z'
              data:
                trackingCode: PCL123
                currentStatus: DELIVERED
                event:
                  status: DELIVERED
                  timestamp: '2026-11-25T03:00:00.000Z'
      responses:
        '204':
          description: Receiver accepted the event
        '400':
          description: Invalid or replayed event
        '401':
          description: Invalid signature
      summary: Receive a signed status webhook
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Role:
      type: string
      enum:
        - customer
        - shipper
        - warehouse_staff
        - admin
    ParcelStatus:
      type: string
      enum:
        - CREATED
        - PENDING_PICKUP
        - PICKED_UP
        - IN_TRANSIT
        - AT_HUB
        - OUT_FOR_DELIVERY
        - DELIVERED
        - DELIVERY_FAILED
        - RETURNING
        - RETURNED
        - CANCELLED
        - LOST
    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6
      required:
        - fullName
        - email
        - phone
        - password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            fullName:
              type: string
            email:
              type: string
              format: email
            role:
              $ref: '#/components/schemas/Role'
          required:
            - id
            - fullName
            - email
            - role
      required:
        - accessToken
        - user
    PricingRequest:
      type: object
      properties:
        weightKg:
          type: number
          minimum: 0
          maximum: 1000
        senderLat:
          type: number
          minimum: -90
          maximum: 90
        senderLng:
          type: number
          minimum: -180
          maximum: 180
        receiverLat:
          type: number
          minimum: -90
          maximum: 90
        receiverLng:
          type: number
          minimum: -180
          maximum: 180
      required:
        - weightKg
        - senderLat
        - senderLng
        - receiverLat
        - receiverLng
    CreateParcelRequest:
      allOf:
        - $ref: '#/components/schemas/PricingRequest'
        - type: object
          properties:
            receiverName:
              type: string
              minLength: 1
            receiverPhone:
              type: string
              minLength: 1
            receiverAddress:
              type: string
              minLength: 1
            dimensions:
              type: string
          required:
            - receiverName
            - receiverPhone
            - receiverAddress
    UpdateStatusRequest:
      type: object
      properties:
        event:
          type: string
          enum:
            - create_parcel
            - assign_courier
            - cancel_order
            - confirm_pickup
            - depart_to_hub
            - arrive_at_hub
            - dispatch_to_next_hub
            - dispatch_last_mile
            - sla_timeout
            - confirm_delivery
            - report_failed_delivery
            - retry_delivery
            - max_retries_reached
            - confirm_return_to_sender
        hubId:
          type: string
          minLength: 1
          description: >-
            Existing hub ID. Required for arrive_at_hub; server loads Location.type and current/destination
            hub IDs.
        deliveryProofRef:
          type: string
          maxLength: 200
          description: >-
            Non-blank after trimming for confirm_delivery. Stored in Parcel.deliveryProof. An evidence
            reference only; no image/OTP verification is currently performed.
      required:
        - event
      allOf:
        - if:
            properties:
              event:
                const: arrive_at_hub
            required:
              - event
          then:
            required:
              - hubId
            properties:
              event:
                type: string
                enum:
                  - create_parcel
                  - assign_courier
                  - cancel_order
                  - confirm_pickup
                  - depart_to_hub
                  - arrive_at_hub
                  - dispatch_to_next_hub
                  - dispatch_last_mile
                  - sla_timeout
                  - confirm_delivery
                  - report_failed_delivery
                  - retry_delivery
                  - max_retries_reached
                  - confirm_return_to_sender
              hubId:
                type: string
                minLength: 1
                description: >-
                  Existing hub ID. Required for arrive_at_hub; server loads Location.type and
                  current/destination hub IDs.
              deliveryProofRef:
                type: string
                maxLength: 200
                description: >-
                  Non-blank after trimming for confirm_delivery. Stored in Parcel.deliveryProof. An evidence
                  reference only; no image/OTP verification is currently performed.
        - if:
            properties:
              event:
                const: confirm_delivery
            required:
              - event
          then:
            required:
              - deliveryProofRef
            properties:
              event:
                type: string
                enum:
                  - create_parcel
                  - assign_courier
                  - cancel_order
                  - confirm_pickup
                  - depart_to_hub
                  - arrive_at_hub
                  - dispatch_to_next_hub
                  - dispatch_last_mile
                  - sla_timeout
                  - confirm_delivery
                  - report_failed_delivery
                  - retry_delivery
                  - max_retries_reached
                  - confirm_return_to_sender
              hubId:
                type: string
                minLength: 1
                description: >-
                  Existing hub ID. Required for arrive_at_hub; server loads Location.type and
                  current/destination hub IDs.
              deliveryProofRef:
                type: string
                maxLength: 200
                description: >-
                  Non-blank after trimming for confirm_delivery. Stored in Parcel.deliveryProof. An evidence
                  reference only; no image/OTP verification is currently performed.
                minLength: 1
                pattern: \S
    Parcel:
      type: object
      properties:
        id:
          type: string
        trackingCode:
          type: string
        senderId:
          type: string
        receiverName:
          type: string
        receiverPhone:
          type: string
        receiverAddress:
          type: string
        weightKg:
          oneOf:
            - type: string
              pattern: ^-?[0-9]+(.[0-9]+)?$
            - type: number
          description: Prisma Decimal is normally serialized as a JSON string.
        dimensions:
          anyOf:
            - type: string
            - type: 'null'
        codAmount:
          anyOf:
            - oneOf:
                - type: string
                  pattern: ^-?[0-9]+(.[0-9]+)?$
                - type: number
              description: Prisma Decimal is normally serialized as a JSON string.
            - type: 'null'
        currentStatus:
          $ref: '#/components/schemas/ParcelStatus'
        failedAttemptCount:
          type: integer
        originLocationId:
          anyOf:
            - type: string
            - type: 'null'
        destinationLocationId:
          anyOf:
            - type: string
            - type: 'null'
        currentLocationId:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        feeVnd:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Persisted quote in integer VND for new parcels. Null means unknown legacy fee.
        senderLat:
          anyOf:
            - oneOf:
                - type: string
                  pattern: ^-?[0-9]+(.[0-9]+)?$
                - type: number
              description: Prisma Decimal is normally serialized as a JSON string.
            - type: 'null'
        senderLng:
          anyOf:
            - oneOf:
                - type: string
                  pattern: ^-?[0-9]+(.[0-9]+)?$
                - type: number
              description: Prisma Decimal is normally serialized as a JSON string.
            - type: 'null'
        receiverLat:
          anyOf:
            - oneOf:
                - type: string
                  pattern: ^-?[0-9]+(.[0-9]+)?$
                - type: number
              description: Prisma Decimal is normally serialized as a JSON string.
            - type: 'null'
        receiverLng:
          anyOf:
            - oneOf:
                - type: string
                  pattern: ^-?[0-9]+(.[0-9]+)?$
                - type: number
              description: Prisma Decimal is normally serialized as a JSON string.
            - type: 'null'
        deliveryProof:
          anyOf:
            - type: string
              description: >-
                Stored trimmed deliveryProofRef from confirm_delivery. Evidence content is not verified by the
                current service. Internal only.
            - type: 'null'
        deliveredAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        driverLatitude:
          anyOf:
            - oneOf:
                - type: string
                  pattern: ^-?[0-9]+(.[0-9]+)?$
                - type: number
              description: Prisma Decimal is normally serialized as a JSON string.
            - type: 'null'
        driverLongitude:
          anyOf:
            - oneOf:
                - type: string
                  pattern: ^-?[0-9]+(.[0-9]+)?$
                - type: number
              description: Prisma Decimal is normally serialized as a JSON string.
            - type: 'null'
        driverLocationAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - trackingCode
        - senderId
        - receiverName
        - receiverPhone
        - receiverAddress
        - weightKg
        - currentStatus
        - createdAt
        - updatedAt
    ParcelStatusHistory:
      type: object
      properties:
        id:
          type: string
        parcelId:
          type: string
        status:
          $ref: '#/components/schemas/ParcelStatus'
        locationId:
          anyOf:
            - type: string
            - type: 'null'
        changedBy:
          anyOf:
            - type: string
            - type: 'null'
        note:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - parcelId
        - status
        - createdAt
    DeliveryAssignment:
      type: object
      properties:
        id:
          type: string
        parcelId:
          type: string
        courierId:
          type: string
        assignmentType:
          type: string
          enum:
            - pickup
            - last_mile
            - hub_transfer
        status:
          type: string
          enum:
            - assigned
            - accepted
            - in_progress
            - completed
            - failed
            - cancelled
        assignedAt:
          type: string
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        notes:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - id
        - parcelId
        - courierId
        - assignmentType
        - status
        - assignedAt
    PublicTracking:
      type: object
      properties:
        trackingCode:
          type: string
        currentStatus:
          $ref: '#/components/schemas/ParcelStatus'
        receiverName:
          type: string
        history:
          type: array
          items:
            type: object
            properties:
              status:
                $ref: '#/components/schemas/ParcelStatus'
              timestamp:
                type: string
                format: date-time
              note:
                type: string
            required:
              - status
              - timestamp
        location:
          anyOf:
            - $ref: '#/components/schemas/ParcelLocationUpdated'
            - type: 'null'
          description: >-
            Last persisted driver position. Null when no complete position/timestamp exists, including after
            last-mile dispatch clears the previous position.
      required:
        - trackingCode
        - currentStatus
        - receiverName
        - history
        - location
    ParcelStatusUpdated:
      type: object
      properties:
        trackingCode:
          type: string
        currentStatus:
          $ref: '#/components/schemas/ParcelStatus'
        event:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/ParcelStatus'
            timestamp:
              type: string
              format: date-time
            note:
              type: string
          required:
            - status
            - timestamp
      required:
        - trackingCode
        - currentStatus
        - event
    ParcelLocationUpdated:
      type: object
      properties:
        trackingCode:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timestamp:
          type: string
          format: date-time
      required:
        - trackingCode
        - latitude
        - longitude
        - timestamp
    ParcelStatusWebhook:
      type: object
      properties:
        eventId:
          type: string
          description: Committed ParcelStatusHistory.id, also sent in X-Webhook-Id.
        type:
          const: parcel.status.updated
        occurredAt:
          type: string
          format: date-time
          description: Exact data.event.timestamp from the committed history row.
        data:
          $ref: '#/components/schemas/ParcelStatusUpdated'
      required:
        - eventId
        - type
        - occurredAt
        - data
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
      required:
        - statusCode
        - message
    AssignCourierRequest:
      type: object
      description: >-
        Fields are optional at DTO level; service requires a valid destination hub from the request or saved
        parcel. Both pickup coordinates are required when the parcel lacks a complete stored coordinate pair.
      properties:
        destinationHubId:
          type: string
          minLength: 1
          description: >-
            Hub selected by admin, saved as destinationLocationId. May be omitted only if the parcel already
            has a valid destination hub.
        pickupLat:
          type: number
          minimum: -90
          maximum: 90
          description: Legacy fallback latitude, used with pickupLng only when stored sender coordinates are incomplete.
        pickupLng:
          type: number
          minimum: -180
          maximum: 180
          description: Legacy fallback longitude, used with pickupLat only when stored sender coordinates are incomplete.
    Hub:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
      required:
        - id
        - name
        - address
  responses:
    Error400:
      description: Invalid input or transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Actor or role denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Parcel not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Duplicate or concurrent write
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: HTTP quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds until quota reset
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
x-socketio:
  namespace: /
  room: parcel:{trackingCode}
  clientEvents:
    join:parcel:
      trackingCode: PCL123
    leave:parcel:
      trackingCode: PCL123
    driver:location:
      trackingCode: PCL123
      latitude: 10.7292
      longitude: 106.6935
  serverEvents:
    parcel.status.updated:
      $ref: '#/components/schemas/ParcelStatusUpdated'
    parcel.delivery.completed:
      $ref: '#/components/schemas/ParcelStatusUpdated'
    parcel.location.updated:
      $ref: '#/components/schemas/ParcelLocationUpdated'
  description: >-
    Default namespace and parcel:{trackingCode} rooms. Driver GPS requires JWT in handshake auth.token, active
    shipper assignment and valid coordinates; persists location before emit. Subscribe/reconnect/resync
    details in INTEGRATION.md.
  driverAuthentication:
    handshake:
      auth:
        token: <JWT>
