name: Backend CI & E2E

on:
  push:
    branches: [ main, develop, "feat/**", "fix/**", "test/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint (strict without --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build Backend
        run: npm run build

      - name: Run Unit Tests with Coverage
        run: npx jest --coverage

  e2e-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: lastmile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/lastmile_test?schema=public
      JWT_SECRET: test_jwt_secret_for_ci_pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Prisma Schema to Test DB
        run: npx prisma db push

      - name: Run E2E Tests
        run: npm run test:e2e