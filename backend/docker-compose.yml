services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lastmile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lastmile_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/lastmile_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-must-be-at-least-32-characters}
      JWT_EXPIRES_IN: 1d
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-ChangeMeDemo123!}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PARCEL_WEBHOOK_URL: ${PARCEL_WEBHOOK_URL:-}
      PARCEL_WEBHOOK_SECRET: ${PARCEL_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             npm run start:prod"
