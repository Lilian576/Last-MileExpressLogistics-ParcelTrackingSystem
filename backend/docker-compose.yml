services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: parcel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parcel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parcel
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-must-be-at-least-32-characters}
      JWT_EXPIRES_IN: 1d
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-ChangeMeDemo123!}
      PORT: 3000
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             node dist/main.js"
