version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lastmile_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lastmile_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lastmile_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastmile_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/lastmile_db?schema=public
      JWT_SECRET: super_secret_jwt_key_for_docker_env
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy